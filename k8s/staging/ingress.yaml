apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skills-hub
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - skills-staging.acme.com
    secretName: skills-hub-tls
  rules:
  - host: skills-staging.acme.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: skills-hub
            port:
              number: 80
