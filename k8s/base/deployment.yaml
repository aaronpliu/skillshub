apiVersion: apps/v1
kind: Deployment
metadata:
  name: skills-hub
  labels:
    app: skills-hub
    tier: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: skills-hub
  template:
    metadata:
      labels:
        app: skills-hub
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/health"
    spec:
      serviceAccountName: skills-hub
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: skills-hub
        image: ghcr.io/acme/skills-hub:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: skills-hub-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: skills-hub-secrets
              key: redis-url
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: skills-hub-config
              key: s3-bucket
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: skills-hub
---
apiVersion: v1
kind: Service
metadata:
  name: skills-hub
spec:
  selector:
    app: skills-hub
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
