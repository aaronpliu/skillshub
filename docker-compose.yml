version: "3.8"

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: skills-hub-postgres
    environment:
      POSTGRES_USER: skills
      POSTGRES_PASSWORD: skills_dev
      POSTGRES_DB: skills_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skills -d skills_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Redis (Cache + Queue)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: skills-hub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # MinIO (S3-compatible Object Storage)
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: skills-hub-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Create default buckets
  minio-init:
    image: minio/mc:latest
    container_name: skills-hub-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/skills-hub --ignore-existing;
      mc mb local/skills-hub-audit --ignore-existing;
      echo 'Buckets created successfully';
      "

  # ===========================================================================
  # Elasticsearch (Search)
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    container_name: skills-hub-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Application (Development)
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: skills-hub-app
    environment:
      DATABASE_URL: postgresql://skills:skills_dev@postgres:5432/skills_hub?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-secret-change-in-production-min-32-chars!!
      JWT_SECRET: dev-jwt-secret-change-in-production-min-32-chars!!
      ENCRYPTION_KEY: dev-encryption-key-32-chars-min!!
      AUDIT_HMAC_KEY: dev-audit-hmac-key-change-in-prod!!
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  minio_data:
  es_data:
