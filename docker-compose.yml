version: "3.8"

# =============================================================================
# Infrastructure Services (Backend Dependencies)
# =============================================================================
# Usage:
#   podman compose up -d       # Start all services
#   podman compose down        # Stop all services
#   podman compose down -v     # Stop and delete data
#   podman compose ps          # Check status
#   podman compose logs -f     # Follow logs
#
# The Next.js app runs natively (not in a container).
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL 18
  # ===========================================================================
  postgres:
    image: postgres:18-alpine
    container_name: skills-hub-postgres
    environment:
      POSTGRES_USER: skills
      POSTGRES_PASSWORD: skills_dev
      POSTGRES_DB: skills_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skills -d skills_hub"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # Valkey 8 (Redis-compatible cache)
  # ===========================================================================
  valkey:
    image: valkey/valkey:8-alpine
    container_name: skills-hub-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # RustFS (S3-compatible Object Storage, MinIO alternative)
  # ===========================================================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: skills-hub-rustfs
    environment:
      RUSTFS_ROOT_USER: rustfsadmin
      RUSTFS_ROOT_PASSWORD: rustfsadmin
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web Console
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Create default buckets on startup using AWS CLI
  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: skills-hub-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      aws --endpoint-url http://rustfs:9000 s3 mb s3://skills-hub 2>/dev/null || true;
      aws --endpoint-url http://rustfs:9000 s3 mb s3://skills-hub-audit 2>/dev/null || true;
      echo 'Buckets created successfully';
      "
    restart: "no"

  # ===========================================================================
  # Elasticsearch 9
  # ===========================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    container_name: skills-hub-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===========================================================================
  # Prometheus (Metrics Collection)
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: skills-hub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ===========================================================================
  # Grafana (Metrics Visualization)
  # ===========================================================================
  grafana:
    image: grafana/grafana:11.4.0
    container_name: skills-hub-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  valkey_data:
  rustfs_data:
  es_data:
  prometheus_data:
  grafana_data:
